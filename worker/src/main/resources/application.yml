spring:
  application:
    name: tutoria-worker
  main:
    web-application-type: none
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:tutoria}
    password: ${RABBITMQ_PASS:tutoria123}
    listener:
      simple:
        concurrency: 2
        max-concurrency: 4
        prefetch: 1
  ai:
    openai:
      api-key: ${GROQ_API_KEY:}
      base-url: ${GROQ_BASE_URL:https://api.groq.com/openai}
      chat:
        options:
          model: ${GROQ_MODEL:openai/gpt-oss-20b}
          temperature: 0.4
          max-tokens: 1024
    # Desabilita retry interno duplicado do Spring AI para usar apenas o @Retryable do TutorAiService (3 tentativas, 2s)
    retry:
      max-attempts: 1

app:
  rabbitmq:
    perguntas-exchange: perguntas.exchange
    perguntas-queue: perguntas.queue
    perguntas-routing-key: perguntas.routing.key
    respostas-exchange: respostas.exchange
    respostas-queue: respostas.queue
    respostas-routing-key: respostas.routing.key

logging:
  level:
    com.tutoria: INFO
